<!DOCTYPE html>
<html lang="PT-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Document</title>
</head>
<body>

    <header class="header">
        <div class="header-left">
            <a href="#" class="logo">
                <span class="logo-symbol">&lt;/</span>
                aggy.dev
                <span class="logo-symbol">&gt;</span>
            </a>

            <div class="availability">
                <span class="status-dot"></span>
                DISPONÍVEL PARA PROJETOS
            </div>
        </div>

        <nav class="navigation">
            <a href="#inicio">// início</a>
            <a href="#projetos">// projetos</a>
            <a href="#identidade">// identidade</a>
            <a href="#skills">// skills</a>
            <a href="#contato">// contato</a>
        </nav>

        <div class="header-actions">
            <button class="action-btn language" aria-label="Idioma">
                EN
            </button>

            <button class="action-btn" aria-label="Compartilhar">
                <svg viewBox="0 0 24 24" fill="none">
                    <circle cx="18" cy="5" r="3"/>
                    <circle cx="6" cy="12" r="3"/>
                    <circle cx="18" cy="19" r="3"/>
                    <path d="M8.7 10.5L15.3 6.5M8.7 13.5L15.3 17.5"/>
                </svg>
            </button>

            <label class="theme-toggle" for="theme-toggle">
                <input type="checkbox" id="theme-toggle">
                <svg class="sun-icon" viewBox="0 0 24 24" fill="none">
                    <circle cx="12" cy="12" r="4"/>
                    <path d="M12 2V4M12 20V22M4.93 4.93L6.34 6.34M17.66 17.66L19.07 19.07M2 12H4M20 12H22M4.93 19.07L6.34 17.66M17.66 6.34L19.07 4.93"/>
                </svg>
                <svg class="moon-icon" viewBox="0 0 24 24" fill="none">
                    <path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5 8.5 8.5 0 1 0 20.5 14.5Z"/>
                </svg>
            </label>
        </div>
    </header>


    <main>
        <section class="hero" id="inicio">
            <p class="hero-greeting">
                Olá, seja bem-vindo(a) ao meu espaço.
            </p>

            <h1 class="hero-title">
                AGATHA <span>TOBIAS GOMES</span>
            </h1>

            <h2 class="hero-subtitle">
                Desenvolvedora Full-Stack & UI/UX Designer
            </h2>
        </section>
    </main>


</body>
</html>
